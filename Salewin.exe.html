<title>virusderkrm — zararsız prank</title>
<style>
  html,body {
    margin:0; width:100%; height:100%; overflow:hidden;
    background:#000; font-family:ui-monospace,Consolas,monospace;
    cursor:crosshair;
  }
  #bg {
    position:fixed; inset:0;
    width:100%; height:100%; object-fit:cover;
    image-rendering:auto;
    filter:saturate(1.35) contrast(1.15);
    transform:scale(1.03);
    transition:opacity .12s linear, filter .12s linear, transform .12s linear;
  }
  .scan {
    position:fixed; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.035) 0px,
        rgba(255,255,255,.035) 1px,
        rgba(0,0,0,.055) 2px,
        rgba(0,0,0,.055) 4px
      );
    mix-blend-mode:overlay;
  }
  #noise {
    position:fixed; inset:-20%; pointer-events:none; opacity:.16;
    background-image:
      radial-gradient(circle at 15% 30%, #ff00aa 0 2px, transparent 3px),
      radial-gradient(circle at 75% 70%, #00ffe7 0 2px, transparent 3px),
      radial-gradient(circle at 55% 20%, #ffef00 0 1px, transparent 2px);
    background-size:32px 29px, 41px 37px, 23px 31px;
    animation:drift .22s steps(2,end) infinite;
  }
  @keyframes drift {
    from { transform:translate(0,0) rotate(0deg); }
    to   { transform:translate(2%, -1%) rotate(.2deg); }
  }
  #label {
    position:fixed; left:14px; bottom:12px; z-index:5;
    color:#fff; background:rgba(0,0,0,.45);
    padding:7px 10px; border:1px solid rgba(255,255,255,.25);
    font-size:12px; letter-spacing:.08em;
    text-shadow:0 0 8px #ff00aa;
    user-select:none;
  }
  #start {
    position:fixed; inset:0; z-index:10;
    display:grid; place-items:center;
    background:rgba(0,0,0,.78);
    color:white;
  }
  #start button {
    font:700 18px ui-monospace,Consolas,monospace;
    color:#fff; background:#111;
    border:2px solid #ff25c8;
    box-shadow:0 0 25px #ff25c888, inset 0 0 18px #00ffe744;
    border-radius:12px; padding:16px 24px;
    cursor:pointer;
  }
  .flash {
    animation:flash .11s steps(2,end);
  }
  @keyframes flash {
    0% { filter:hue-rotate(0deg) saturate(1.2) contrast(1.1); transform:scale(1.03) translate(0,0); }
    50% { filter:hue-rotate(130deg) saturate(2) contrast(1.45); transform:scale(1.055) translate(4px,-3px); }
    100% { filter:hue-rotate(260deg) saturate(1.3) contrast(1.2); transform:scale(1.03) translate(-3px,2px); }
  }
</style>

const bg = document.getElementById("bg");
const music = document.getElementById("music");
const start = document.getElementById("start");
const go = document.getElementById("go");

let current = -1;

function swapImage() {
  let next;
  do {
    next = Math.floor(Math.random() * images.length);
  } while (images.length > 1 && next === current);

  current = next;
  bg.style.opacity = "0.18";
  setTimeout(() => {
    bg.src = images[current];
    bg.classList.remove("flash");
    void bg.offsetWidth;
    bg.classList.add("flash");
    bg.style.opacity = "1";
  }, 80);

  // Rastgele ama aşırı hızlı olmayan değişim:
  const nextDelay = 650 + Math.random() * 1250;
  setTimeout(swapImage, nextDelay);
}

function startPrank() {
  start.style.display = "none";
  bg.src = images[Math.floor(Math.random()*images.length)];
  swapImage();
  music.volume = 0.85;
  music.play().catch(() => {
    // Tarayıcı ses iznini engellerse ilk tıklamada tekrar denenir.
    document.body.addEventListener("click", () => music.play(), {once:true});
  });
}

go.addEventListener("click", startPrank);

// Sekmeye dönünce ses durmuşsa tekrar başlatmayı dene.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && start.style.display === "none" && music.paused) {
    music.play().catch(()=>{});
  }
});
</script>
